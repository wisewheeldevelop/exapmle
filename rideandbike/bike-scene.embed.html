/* ═══════════════════════════════════════════════════════════════════
   14b · QA / DEEP LINKS
   ?t=999&cam=side&hud=0&iso=bike&grid=0&flat=1&bolt=1
   ═══════════════════════════════════════════════════════════════════ */
const Q = new URLSearchParams(location.search);
let QA_STATIC = false;
let RIDE_MODE = Q.get('ride') || '';
let heroProduct = Q.get('iso') === 'scooter' ? 'scooter' : 'bike';
let SCENE_ACTIVE = true;
const HERO_FIT = Number.isFinite(Number.parseFloat(Q.get('fit'))) ? Number.parseFloat(Q.get('fit')) : 1.26;

/** frame an object so it fills the viewport from a given direction */
const ISO_DIR = {
  side:  V( 0,    0,    1),
  side2: V( 0,    0,   -1),
  front: V( 1,    0,    0),
  rear:  V(-1,    0,    0),
  hero:  V( 0.80, 0.34, 0.86),
  hero2: V(-0.80, 0.34, 0.86),
  top:   V( 0.02, 1,    0.02),
};
function frameObject(obj, dir, pad = 1.18){
  const box    = new THREE.Box3().setFromObject(obj);
  const size   = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const fovV   = camera.fov * Math.PI/180;
  const fovH   = 2*Math.atan(Math.tan(fovV/2) * camera.aspect);
  // the silhouette width depends on which way we're looking
  const w = Math.abs(dir.x) > Math.abs(dir.z) ? size.z : size.x;
  const dist = Math.max((size.y*pad/2)/Math.tan(fovV/2),
                        (w    *pad/2)/Math.tan(fovH/2));
  camera.position.copy(center).addScaledVector(dir.clone().normalize(), dist);
  controls.target.copy(center);
  controls.update();
}

if(Q.has('t')){
  timeline = parseFloat(Q.get('t')) || 0;
  playing  = false;
  QA_STATIC = true;                 // suppress weld sparks + the boot fade
  document.getElementById('boot').remove();
}
if(Q.get('hud') === '0'){
  document.querySelectorAll('.hud, #dock, #hint').forEach(e=>e.style.display='none');
}
if(Q.get('grid') === '0'){ grid.visible = false; pool.visible = false; floorBase.visible = false; }
if(Q.get('flat') === '1'){
  scene.fog = null; grade.uniforms.uVig.value = 0; grade.uniforms.uGrain.value = 0;
}
if(Q.has('only')){
  const o = Q.get('only');
  bike.visible    = (o !== 'scooter');
  scooter.visible = (o !== 'bike');
}

// isolate + auto-frame a single product, squared up at the origin
if(Q.has('iso')){
  const which = heroProduct;
  const obj   = which === 'scooter' ? scooter : bike;
  bike.visible = which === 'bike';  scooter.visible = which === 'scooter';
  obj.position.set(0,0,0); obj.rotation.set(0,0,0);
  obj.updateMatrixWorld(true);
  frameObject(obj, ISO_DIR[Q.get('cam')] || ISO_DIR.side, HERO_FIT);
} else if(Q.has('cam')){
  const c = CAMS[Q.get('cam')];
  if(c){ camera.position.copy(c.p); controls.target.copy(c.t); controls.update(); }
}

addEventListener('message',event=>{
  if(event.origin!==location.origin&&event.origin!=='null')return;
  if(event.data?.type==='ride-scene-active'){
    SCENE_ACTIVE=Boolean(event.data.active);
    if(SCENE_ACTIVE) startLoop(); else stopLoop();
  }else if(event.data?.type==='storm-flash'){
    applyStormFlash(event.data.energy);
  }
});
/* Steering is applied around the real front assembly pivot rather than the
   product origin. This keeps the bar, fork, fender, light and wheel connected
   while allowing each part a small mechanical amount of compliance. */
function applySteering(root,angle,chatter=0,frontTravel=0){
  for(const entry of root.userData.steering||[]){
    if(!entry.base){
      entry.base={position:entry.obj.position.clone(),rotation:entry.obj.rotation.clone()};
    }
    const a=angle*entry.gain,c=Math.cos(a),s=Math.sin(a),p=entry.pivot,b=entry.base;
    const rx=c*p.x+s*p.z,rz=-s*p.x+c*p.z;
    entry.obj.position.set(b.position.x+p.x-rx,b.position.y,b.position.z+p.z-rz);
    if(entry.role==='cockpit')entry.obj.position.y+=chatter;
    if(entry.role==='wheel'||entry.role==='fender')entry.obj.position.y+=frontTravel;
    if(entry.role==='fork')entry.obj.position.y+=frontTravel*.12;
    entry.obj.rotation.set(b.rotation.x,b.rotation.y+a,b.rotation.z);
  }
  root.userData.steerAngle=angle;
}
/* The cinematic ride has a single fixed-step source of truth: ride-director.js.
   Nothing else may move, rotate or reframe the product while a ride is live. */
/* The vehicle now travels up to ~120 m down the shared road spline, so the
   product layer needs the road layer's depth cues: the same exponential haze
   and the same far plane, or a distant bike reads as a crisp sticker floating
   over a fogged landscape. The road scene uses FogExp2(0x071018, .0072). */
if(RIDE_MODE && RIDE_MODE !== 'showcase'){
  scene.fog = new THREE.FogExp2(0x071018, 0.0072);
  // The hero rasterises this layer across the whole viewport, and the rig
  // moves every frame so the shadow map cannot be cached. At hero scale a
  // 1024² map is indistinguishable from 2048² and costs a quarter as much.
  key.shadow.mapSize.set(Math.min(SHADOW_SIZE,1024), Math.min(SHADOW_SIZE,1024));
  key.shadow.map?.dispose();
  key.shadow.map = null;
}

const rideDirector = createRideDirector({
  THREE, scene, camera, controls, renderer, composer, grade, bloom,
  rig:productRig, dprCap:DPR_CAP,
  products:{bike,scooter},
  dimensions:{
    bike:{wheelRadius:BIKE.R,wheelbase:BIKE.wb,frontTravel:.085,rearTravel:.060},
    scooter:{wheelRadius:SCOOT.R,wheelbase:SCOOT.wb,frontTravel:.040,rearTravel:.035}
  },
  applySteering,
  query:Q,
  onProductChanged:(product,mode)=>{
    heroProduct=product;
    RIDE_MODE=mode;
    scene.fog = (mode && mode !== 'showcase')
      ? (scene.fog || new THREE.FogExp2(0x071018, 0.0072))
      : null;
  }
});

/* Test ride. A rider-controlled mode on a closed circuit, sharing this
   scene's models, materials and post chain — the machine you drive is
   literally the machine the store sells, not a stand-in. */
let freeRide = null;
if(RIDE_MODE === 'freeride'){
  scene.fog = new THREE.FogExp2(0x0a1018, 0.0042);
  shadowCatcher.visible = false;   // the circuit takes real shadows from the sun
  freeRide = createFreeRide({
    THREE, scene, camera, renderer, composer, grade, bloom,
    products:{bike,scooter}, applySteering, rig:productRig,
    product: heroProduct,
    onProduct:which=>{
      heroProduct = which;
      if(window.parent!==window){
        window.parent.postMessage(
          {type:'free-ride-product',product:which},
          location.origin==='null'?'*':location.origin
        );
      }
    }
  });
  addEventListener('message',event=>{
    if(event.origin!==location.origin&&event.origin!=='null')return;
    const data=event.data||{};
    if(data.type==='free-ride-set-product') freeRide.setProduct(data.product);
    else if(data.type==='free-ride-reset') freeRide.reset();
  });
  window.__freeRide = freeRide;
}

// Keep both products fully framed inside the narrower Casa Bike hero slot.
function frameProducts(){
  bike.updateMatrixWorld(true); scooter.updateMatrixWorld(true);
  const box=new THREE.Box3();
  if(bike.visible)box.union(new THREE.Box3().setFromObject(bike));
  if(scooter.visible)box.union(new THREE.Box3().setFromObject(scooter));
  const center = box.getCenter(new THREE.Vector3());
  const forward = V(2.30,.48,2.45).normalize();
  const right = new THREE.Vector3().crossVectors(V(0,1,0),forward).normalize();
  const up = new THREE.Vector3().crossVectors(forward,right).normalize();
  const tanV = Math.tan(camera.fov*Math.PI/360);
  const tanH = tanV*camera.aspect;
  let distance = 0;
  for(const x of [box.min.x,box.max.x])
    for(const y of [box.min.y,box.max.y])
      for(const z of [box.min.z,box.max.z]){
        const corner=V(x,y,z).sub(center), depth=corner.dot(forward);
        distance=Math.max(distance,
          depth+Math.abs(corner.dot(right))*1.18/tanH,
          depth+Math.abs(corner.dot(up))*1.18/tanV);
      }
  camera.position.copy(center).addScaledVector(forward,distance);
  controls.target.copy(center); controls.update();
}

/* ═══════════════════════════════════════════════════════════════════
   15 · MAIN LOOP
   ═══════════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
let fpsAcc = 0, fpsN = 0, fpsT = 0;
let nextBolt = 1.2;
const productLightning = Q.get('productLightning') !== '0';
// UnrealBloomPass composites transparent pixels over opaque black in several
// WebGL/ANGLE combinations. The landing-page scene must preserve alpha, so
// the transparent hero uses the native renderer; full-canvas studio/debug
// modes keep the composer chain.
const transparentHeroRender = Q.get('flat') === '1';
// deterministic captures: suppress the random bolt cadence unless asked
if(Q.has('t') || !productLightning) nextBolt = 1e9;
if(Q.get('bolt') === '1'){
  strike(V(-0.16, 1.10, -0.80));
  if(QA_STATIC) boltFreeze = true;      // hold at peak so a still can catch it
}

/* Scissor state. Declared before resize() so the initial layout pass, which
   resets it, cannot run into the temporal dead zone. */
const scissorBox = new THREE.Box3();
const scissorPoint = new THREE.Vector3();
let previousRect = null;

const governor=createPerfGovernor({
  renderer, composer,
  baseRatio:Math.min(devicePixelRatio,DPR_CAP),
  targetMs:1000/60,
  minScale:0.72,
  enabled:TIER!=='desktop',
  onChange:()=>{ previousRect=null; resize(); }
});

function resize(){
  const w = innerWidth, h = innerHeight;
  let activeDpr=Math.min(devicePixelRatio,2);
  previousRect=null;
  if(freeRide){
    // The chase camera owns framing; resize only has to keep the buffers right.
    activeDpr=governor.reapply();
    camera.aspect=w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w,h);
    composer.setSize(w,h);
  }else if(RIDE_MODE){
    activeDpr=rideDirector.resize(w,h);
  }else{
    camera.aspect = w/h; camera.updateProjectionMatrix();
  }
  if(!RIDE_MODE&&Q.has('iso')){
    const obj=heroProduct==='scooter'?scooter:bike;
    frameObject(obj,ISO_DIR[Q.get('cam')]||ISO_DIR.side,RIDE_MODE?HERO_FIT:1.18);
  }else if(!RIDE_MODE) frameProducts();
  if(!RIDE_MODE){
    renderer.setSize(w,h);
    composer.setSize(w,h);
  }
  $('sRes').textContent = `${w}×${h} @${activeDpr.toFixed(1)}x`;
}
addEventListener('resize', resize);
document.addEventListener('visibilitychange',()=>{
  rideDirector.setActive(!document.hidden&&SCENE_ACTIVE);
  if(document.hidden) stopLoop(); else startLoop();
});
resize();

/* A suspended scene must stop scheduling frames, not skip work inside frames
   it keeps scheduling. Three idle scenes each waking the compositor sixty
   times a second is most of why a phone with several embeds feels sticky. */
let loopHandle = 0;
function startLoop(){
  if(loopHandle || !SCENE_ACTIVE || CONTEXT_LOST || document.hidden) return;
  clock.getDelta();               // drop the time spent asleep
  loopHandle = requestAnimationFrame(tick);
}
function stopLoop(){
  if(!loopHandle) return;
  cancelAnimationFrame(loopHandle);
  loopHandle = 0;
}

function tick(){
  loopHandle = requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const et = clock.elapsedTime;
  if(CONTEXT_LOST){ stopLoop(); return; }

  if(playing){
    timeline += dt*2.5;
    if(timeline > TOTAL){ timeline = TOTAL; playing = false; }
  }
  const done = applyAssembly(timeline);
  updateFlashes(dt);
  if(freeRide) freeRide.update(dt);
  else if(RIDE_MODE) rideDirector.update(dt);

  // idle wheel roll once fully assembled
  if(!playing&&!RIDE_MODE&&!freeRide){
    const spd = dt*0.55;
    [...bike.userData.wheels, ...scooter.userData.wheels].forEach(w=>{
      w.userData.spin.forEach(o=>{ o.rotation.z -= spd; });
      if(w.userData.rotor) w.userData.rotor.rotation.z -= spd;
    });
  }

  // lightning: one at the assembly climax, then on a loose cadence
  nextBolt -= dt;
  if(productLightning && !playing && nextBolt <= 0){
    strike(V((Math.random()<0.5? -0.05: 0.16), 1.05,
             (Math.random()<0.5? -0.62: 0.72)));
    nextBolt = 3.4 + Math.random()*3.4;
  }
  if(productLightning && playing && timeline > TOTAL-0.9 && nextBolt > 0.6){ strike(); nextBolt = 2.6; }

  const flash = updateBolt(dt);
  grade.uniforms.uTime.value  = et;
  grade.uniforms.uFlash.value = flash * 0.085;
  bloom.strength = BLOOM_BASE + flash*0.26;

  // camera tween
  if(camTween){
    camTween.k = Math.min(1, camTween.k + dt*1.5);
    const k = easeOutExpo(camTween.k);
    camera.position.lerpVectors(camTween.p0, camTween.p1, k);
    controls.target.lerpVectors(camTween.t0, camTween.t1, k);
    if(camTween.k >= 1) camTween = null;
  }

  if(!RIDE_MODE||RIDE_MODE==='showcase')controls.update();
  if(transparentHeroRender){
    /* This layer is a full-viewport transparent pane, but the vehicle only
       ever occupies a fraction of it. Shading the rest is pure waste: those
       pixels run the whole PBR path only to be discarded as transparent.

       The projection is left exactly as it was — the shared hero camera is
       untouched, so alignment with the road layer holds to the pixel — and a
       scissor rectangle simply forbids writes outside the vehicle's
       screen-space bounds. Identical image, a fraction of the fill. */
    const box = heroScissorRect();
    if(box){
      renderer.setScissorTest(true);
      renderer.setScissor(box.x, box.y, box.w, box.h);
      renderer.setViewport(0, 0, innerWidth, innerHeight);
      // autoClear is on, so render() clears inside the scissor for us.
      renderer.render(scene,camera);
      renderer.setScissorTest(false);
    }else{
      renderer.clear();
    }
  }
  else composer.render();
  rideDirector.reportFrame(dt);
  governor.sample();

  if(firstFrame){ firstFrame = false; const b=$('boot'); if(b) b.classList.add('gone'); }
  if(!firstFrameSent){
    // The host holds a poster over this canvas until real pixels exist.
    firstFrameSent = true;
    reportToHost('scene-first-frame');
  }

  // ── HUD ──
  const prog = timeline / TOTAL;
  $('phaseBar').style.width = (prog*100).toFixed(1)+'%';
  let label = PHASES[0][1];
  for(const [p,l] of PHASES) if(prog >= p) label = l;
  $('phaseTxt').textContent = label;
  $('sParts').textContent = done;

  fpsAcc += 1/Math.max(dt,1e-4); fpsN++; fpsT += dt;
  if(fpsT > 0.4){ $('sFps').textContent = (fpsAcc/fpsN).toFixed(0);
                  fpsAcc=0; fpsN=0; fpsT=0; }
}

/* Screen-space bounds of everything this layer can draw, in the scissor's
   bottom-left pixel coordinates. Unioning with the previous frame's box is
   what stops a moving vehicle from smearing: the region it has just vacated
   must be cleared too, and the clear is itself scissored. */
/* All rectangles below are CSS pixels with the origin at the bottom-left:
   WebGLRenderer.setScissor multiplies by the pixel ratio itself, so handing
   it device pixels would apply the ratio twice. */
function fullRect(){
  previousRect = null;
  return {x:0, y:0, w:innerWidth, h:innerHeight};
}
function heroScissorRect(){
  const object = scooter.visible ? scooter : bike;
  if(!object || !object.visible) return null;
  object.updateMatrixWorld(true);
  scissorBox.setFromObject(object);
  if(scissorBox.isEmpty()) return fullRect();

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for(const x of [scissorBox.min.x, scissorBox.max.x])
    for(const y of [scissorBox.min.y, scissorBox.max.y])
      for(const z of [scissorBox.min.z, scissorBox.max.z]){
        scissorPoint.set(x,y,z).project(camera);
        // A corner behind the camera projects to nonsense; the safe answer
        // then is the whole screen, never a confidently wrong rectangle.
        if(scissorPoint.z > 1) return fullRect();
        minX = Math.min(minX, scissorPoint.x); maxX = Math.max(maxX, scissorPoint.x);
        minY = Math.min(minY, scissorPoint.y); maxY = Math.max(maxY, scissorPoint.y);
      }

  const width = innerWidth, height = innerHeight;
  // Margin covers the spray, the approach glow and the contact shadow, none
  // of which sit inside the vehicle's own bounding box.
  const margin = Math.max(56, width * 0.06);
  const rect = {
    x0:(minX * 0.5 + 0.5) * width  - margin,
    x1:(maxX * 0.5 + 0.5) * width  + margin,
    y0:(minY * 0.5 + 0.5) * height - margin,
    y1:(maxY * 0.5 + 0.5) * height + margin
  };
  let {x0, y0, x1, y1} = rect;
  if(previousRect){
    x0 = Math.min(x0, previousRect.x0); y0 = Math.min(y0, previousRect.y0);
    x1 = Math.max(x1, previousRect.x1); y1 = Math.max(y1, previousRect.y1);
  }
  previousRect = rect;

  x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
  x1 = Math.min(width, Math.ceil(x1)); y1 = Math.min(height, Math.ceil(y1));
  if(x1 <= x0 || y1 <= y0) return null;
  return {x:x0, y:y0, w:x1-x0, h:y1-y0};
}

// Kick off immediately and drop the loader once a real frame is on screen.
// (Gating on renderer.compileAsync() stalls indefinitely under Chrome's
//  virtual-time clock, which the headless QA capture relies on.)
let firstFrame = true;
startLoop();

// expose for QA
function getRideContactPoint(){
  const product=scooter.visible?scooter:bike;
  const local=(product.userData.rideContactLocal||V(0,1,0)).clone();
  product.updateMatrixWorld(true);
  const world=product.localToWorld(local);
  const projected=world.clone().project(camera);
  // The parent also needs the vehicle's projected footprint so it can decide
  // whether the speech bubble fits above the cockpit or has to sit below the
  // whole vehicle. Deriving it here keeps the parent free of scene geometry.
  const box=new THREE.Box3().setFromObject(product);
  const corner=new THREE.Vector3();
  let bottomV=-Infinity,topV=Infinity,leftU=Infinity,rightU=-Infinity;
  for(const x of [box.min.x,box.max.x])
    for(const y of [box.min.y,box.max.y])
      for(const z of [box.min.z,box.max.z]){
        corner.set(x,y,z).project(camera);
        const u=corner.x*.5+.5,v=.5-corner.y*.5;
        if(v>bottomV)bottomV=v;
        if(v<topV)topV=v;
        if(u<leftU)leftU=u;
        if(u>rightU)rightU=u;
      }
  return {
    x:(projected.x*.5+.5)*innerWidth,
    y:(.5-projected.y*.5)*innerHeight,
    u:projected.x*.5+.5,
    v:.5-projected.y*.5,
    ndcX:projected.x,
    ndcY:projected.y,
    bottomV,topV,leftU,rightU,
    visible:projected.z>=-1&&projected.z<=1
  };
}
window.__scene = {THREE, scene, camera, renderer, controls, bike, scooter,
                  strike, gotoCam, setTime:t=>{timeline=t;playing=false;},
  setRidePhase(p){
    rideDirector.seek(p);
    if(transparentHeroRender)renderer.render(scene,camera);
    else composer.render();
  },
  startRide:()=>rideDirector.start(Date.now()),
  stopRide:()=>rideDirector.stop(),
  resetRide:()=>rideDirector.reset(heroProduct,RIDE_MODE,rideDirector.state.sessionId,true),
  getRideTelemetry:()=>rideDirector.telemetry(),
  getPerformanceMetrics:()=>rideDirector.performanceMetrics(),
  setDebugMode:enabled=>rideDirector.setDebugMode(enabled),
  captureState:()=>rideDirector.captureState(),
  getRideContactPoint,
  sampleRoadHeightAndNormal:(x,z)=>rideDirector.sampleRoadHeightAndNormal(x,z),
  rideState(){
    return rideDirector.captureState();
  },
  /** QA: what mesh is under this NDC point? */
  probe(nx, ny){
    const rc = new THREE.Raycaster();
    rc.setFromCamera(new THREE.Vector2(nx, ny), camera);
    return rc.intersectObjects([bike, scooter], true).slice(0,4).map(h=>({
      dist: +h.distance.toFixed(3),
      part: (function(o){ while(o && !o.userData.pname) o = o.parent;
                          return o ? o.userData.pname : '?'; })(h.object),
      geo:  h.object.geometry.type,
      mat:  h.object.material.type,
      col:  '#'+h.object.material.color?.getHexString(),
      rough:h.object.material.roughness,
      metal:h.object.material.metalness,
    }));
  }};
</script>
