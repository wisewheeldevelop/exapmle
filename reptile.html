<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CASA BIKE · Reptile Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --green:#3df04a;
    --green-bright:#8dff63;
    --green-deep:#0f7a23;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow-x:hidden}
  body{
    font-family:"Heebo","Segoe UI",-apple-system,Helvetica,Arial,sans-serif;
    color:#fff;-webkit-font-smoothing:antialiased;
  }

  /* ---------- HERO SHELL ---------- */
  .hero{
    position:relative;width:100%;
    min-height:100vh;min-height:100dvh;
    overflow:hidden;background:#000;
  }
  /* WebGL canvas — black marble + green lightning, drawn ONCE (static) */
  #fx{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}

  .grade{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background:
      radial-gradient(120% 90% at 24% 46%, rgba(52,232,58,.14), transparent 55%),
      radial-gradient(150% 120% at 86% 60%, rgba(0,0,0,.55), transparent 60%),
      linear-gradient(180deg, rgba(0,0,0,.5) 0%, transparent 22%, transparent 60%, #000 100%);
  }
  .scrim{
    position:absolute;inset:0;z-index:3;pointer-events:none;
    background:linear-gradient(270deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,.2) 32%, transparent 58%);
  }
  .vignette{position:absolute;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 300px 70px rgba(0,0,0,.88)}

  /* ---------- NAV ---------- */
  nav{
    position:absolute;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:clamp(18px,3.5vw,28px) clamp(18px,5vw,72px);
  }
  .brand{
    display:flex;align-items:center;gap:12px;color:#fff;
    font-weight:800;letter-spacing:.3em;font-size:clamp(15px,2.4vw,20px);
    text-transform:uppercase;white-space:nowrap;
  }
  .brand-txt{direction:ltr;unicode-bidi:isolate}
  .brand .spark{
    width:11px;height:11px;border-radius:50%;background:var(--green-bright);
    box-shadow:0 0 14px 3px var(--green),0 0 30px 6px rgba(61,240,74,.6);
  }
  .brand b{color:var(--green)}
  .links{display:flex;gap:38px;list-style:none}
  .links a{
    color:rgba(255,255,255,.82);text-decoration:none;
    font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;transition:color .25s;
  }
  .links a:hover{color:var(--green-bright)}
  .nav-cta{
    border:1px solid rgba(61,240,74,.5);color:var(--green-bright);background:rgba(61,240,74,.08);
    padding:11px 22px;border-radius:40px;
    font-size:12px;letter-spacing:.18em;font-weight:700;text-transform:uppercase;cursor:pointer;transition:.25s;
  }
  .nav-cta:hover{background:var(--green);color:#03210a;box-shadow:0 0 28px rgba(61,240,74,.5)}

  /* ---------- CONTENT ---------- */
  .stage{
    position:relative;z-index:10;direction:ltr;
    min-height:100vh;min-height:100dvh;
    display:grid;grid-template-columns:1.05fr .95fr;align-items:center;
    padding:0 clamp(20px,5vw,72px);gap:20px;
  }
  .product{position:relative;justify-self:start;align-self:center;margin-top:40px}
  .product img{
    width:min(46vw,640px);height:auto;display:block;
    filter:drop-shadow(0 28px 50px rgba(0,0,0,.85)) drop-shadow(0 0 70px rgba(61,240,74,.32));
  }
  /* static reflection on the wet floor */
  .product::after{
    content:"";position:absolute;left:6%;right:6%;bottom:-34%;height:34%;
    background-image:url("Layer-11.png");background-size:cover;background-position:top;
    transform:scaleY(-1);
    -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.4),transparent 75%);
            mask-image:linear-gradient(to bottom,rgba(0,0,0,.4),transparent 75%);
    opacity:.20;filter:blur(3px);pointer-events:none;
  }
  .glow-pool{
    position:absolute;z-index:9;left:0;bottom:6%;width:60%;height:30%;
    background:radial-gradient(60% 80% at 35% 50%,rgba(61,240,74,.26),transparent 70%);
    filter:blur(40px);pointer-events:none;
  }

  .copy{justify-self:end;max-width:520px;text-align:right;direction:rtl}
  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;color:var(--green);
    font-size:12px;letter-spacing:.34em;text-transform:uppercase;font-weight:700;margin-bottom:22px;
    text-shadow:0 0 18px rgba(61,240,74,.5);
  }
  .eyebrow::before{content:"";width:34px;height:1px;background:linear-gradient(270deg,var(--green),transparent)}
  h1{
    font-family:"Rubik","Heebo",sans-serif;font-size:clamp(36px,8vw,90px);
    line-height:1.0;font-weight:900;letter-spacing:-.01em;margin-bottom:24px;color:#fff;
    overflow-wrap:break-word;text-shadow:0 6px 40px rgba(0,0,0,.55);
  }
  h1 .accent{
    background:linear-gradient(110deg,#fff 0%,var(--green-bright) 45%,var(--green) 72%,#0a5417 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  p.lead{color:rgba(228,248,228,.8);font-size:clamp(15px,1.2vw,18px);line-height:1.65;margin-bottom:38px;max-width:440px}

  .actions{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .btn-primary{
    border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--green-bright),var(--green-deep));
    color:#04210a;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    font-size:14px;padding:18px 38px;border-radius:50px;
    box-shadow:0 10px 30px rgba(61,240,74,.42),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .2s,box-shadow .2s;
  }
  .btn-primary:hover{transform:translateY(-3px);box-shadow:0 16px 50px rgba(61,240,74,.66)}
  .btn-ghost{
    background:none;border:none;cursor:pointer;color:#fff;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;font-size:14px;display:flex;align-items:center;gap:12px;
  }
  .btn-ghost .play{
    width:42px;height:42px;border-radius:50%;border:1px solid rgba(61,240,74,.55);
    display:grid;place-items:center;color:var(--green);transition:.25s;
  }
  .btn-ghost:hover .play{background:var(--green);color:#03210a;box-shadow:0 0 24px rgba(61,240,74,.6)}

  .stats{display:flex;gap:42px;margin-top:52px;border-top:1px solid rgba(255,255,255,.1);padding-top:24px}
  .stat .num{font-size:30px;font-weight:800;color:#fff}
  .stat .num span{color:var(--green)}
  .stat .lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:4px}

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:900px){
    .links{display:none}
    .stage{grid-template-columns:1fr;text-align:center;padding-top:96px;padding-bottom:64px;gap:8px}
    .product{justify-self:center;margin-top:24px}
    .product img{width:min(78vw,440px)}
    .copy{justify-self:center;text-align:center;max-width:600px}
    .eyebrow{justify-content:center}.actions{justify-content:center}.stats{justify-content:center}
    .product::after{display:none}
    .scrim{background:linear-gradient(0deg, rgba(0,0,0,.7) 0%, transparent 55%)}
  }
  @media (max-width:560px){
    nav{padding:16px 18px}
    .nav-cta{padding:9px 16px;font-size:11px;letter-spacing:.12em}
    .brand{letter-spacing:.18em;gap:9px}
    .stage{padding-top:88px;padding-bottom:54px}
    .product img{width:86vw}
    p.lead{font-size:15px;max-width:none}
    .actions{gap:12px}
    .btn-primary{padding:15px 24px;font-size:13px;flex:1 1 auto;text-align:center}
    .stats{gap:0;margin-top:34px;padding-top:18px;width:100%;justify-content:space-between}
    .stat{flex:1;text-align:center}.stat .num{font-size:clamp(20px,6vw,28px)}
    .stat .lbl{letter-spacing:.1em;font-size:10px}
  }
</style>
</head>
<body>
<section class="hero">
  <canvas id="fx"></canvas>
  <div class="grade"></div>
  <div class="scrim"></div>
  <div class="vignette"></div>

  <nav>
    <div class="brand"><span class="spark"></span><span class="brand-txt">CASA <b>BIKE</b></span></div>
    <ul class="links">
      <li><a href="#">אופניים חשמליים</a></li>
      <li><a href="#">קורקינטים</a></li>
      <li><a href="#">מבצעים</a></li>
      <li><a href="#">צור קשר</a></li>
    </ul>
    <button class="nav-cta">למבצעי החודש »</button>
  </nav>

  <div class="stage">
    <div class="glow-pool"></div>
    <div class="product">
      <img src="Layer-11.png" alt="CASA BIKE electric bike and scooter" />
    </div>

    <div class="copy">
      <span class="eyebrow">Reptile Edition</span>
      <h1>כוח חשמלי<br><span class="accent">שזורם בעורקים</span></h1>
      <p class="lead">
        סדרת ה-Reptile — אופניים וקורקינטים חשמליים עם מומנט פראי,
        אחיזה לכל שטח ועיצוב שמאיר את הלילה. אנרגיה טהורה.
      </p>
      <div class="actions">
        <button class="btn-primary">למבצעי החודש »</button>
        <button class="btn-ghost"><span class="play">▶</span> צפו בסרטון</button>
      </div>
      <div class="stats">
        <div class="stat"><div class="num">80<span>ק"מ</span></div><div class="lbl">טווח נסיעה</div></div>
        <div class="stat"><div class="num">45<span>קמ"ש</span></div><div class="lbl">מהירות מרבית</div></div>
        <div class="stat"><div class="num">2.5<span>שע'</span></div><div class="lbl">טעינה מהירה</div></div>
      </div>
    </div>
  </div>
</section>

<script>
/* =========================================================
   WebGL fragment shader — black marble + ELECTRIC GREEN lightning
   Generated entirely in code (no image). Drawn a SINGLE time:
   the scene is completely STATIC — no animation loop.
   ========================================================= */
(function(){
  const canvas = document.getElementById('fx');
  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if(!gl){ canvas.style.background = '#040a05'; return; }

  const vsrc = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.0,1.0); }`;

  const fsrc = `
    precision highp float;
    uniform vec2  u_res;
    uniform vec2  u_mouse;   // cursor in uv space (y up)
    uniform float u_influ;   // 0 = idle/static, 1 = actively hovering
    uniform float u_energy;  // cursor speed -> bolt brightness / agitation
    const float T = 7.3;     // frozen "moment in time" for the static frame

    float hash(vec2 p){
      p = fract(p*vec2(123.34,456.21));
      p += dot(p,p+45.32);
      return fract(p.x*p.y);
    }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      vec2 u = f*f*(3.0-2.0*f);
      float a = hash(i+vec2(0,0)), b = hash(i+vec2(1,0));
      float c = hash(i+vec2(0,1)), d = hash(i+vec2(1,1));
      return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
    }
    float fbm(vec2 p){
      float v = 0.0, a = 0.5;
      mat2 m = mat2(1.6,1.2,-1.2,1.6);
      for(int i=0;i<6;i++){ v += a*noise(p); p = m*p; a *= 0.5; }
      return v;
    }

    // jagged, sharply-kinked horizontal offset of a bolt at height y.
    // The cursor re-seeds the jitter so the silhouette re-forms as you move,
    // and faster movement (u_energy) makes the kinks wilder.
    float boltPath(float y, float seed){
      float x = 0.0, amp = 0.135, f = 2.2;
      float jitter = floor(T*9.0)*0.137
                   + (u_mouse.x*1.7 + u_mouse.y*1.1) * u_influ   // reshape with cursor
                   + u_energy*0.6;                               // agitate with speed
      float a = amp * (1.0 + u_energy*0.5);
      for(int i=0;i<6;i++){
        float n = noise(vec2(y*f + seed*7.31, jitter + seed*3.0));
        x += (n*2.0-1.0)*a; a *= 0.52; f *= 2.07;
      }
      return x;
    }
    // hot core + green bloom around one bolt, bending toward the cursor
    float boltGlow(vec2 uv, float baseX, float seed, out float core){
      float path = baseX + boltPath(uv.y, seed);
      // whole field sways with horizontal cursor; the channel also bows toward
      // the cursor most strongly at the cursor's own height -> "reaches" for it
      float vClose = exp(-pow((uv.y - u_mouse.y)*2.6, 2.0));
      path += (u_mouse.x - 0.5) * 0.16 * u_influ;            // global sway
      path += (u_mouse.x - path) * 0.42 * vClose * u_influ;  // reach toward cursor
      float d = abs(uv.x - path);
      core = 0.0016 / (d + 0.0011);
      float halo = 0.012 / (d*d*38.0 + 0.05);
      float taper = smoothstep(0.0,0.10,uv.y) * smoothstep(1.0,0.80,uv.y);
      core *= taper;
      return (core + halo*0.65) * taper;
    }

    void main(){
      vec2 uv = gl_FragCoord.xy / u_res.xy;
      vec2 p  = uv; p.x *= u_res.x / u_res.y;
      float t = T*0.05;

      // -- domain-warped marble with LAYERED PARALLAX --
      // each warp octave is offset by a different amount of the cursor vector,
      // so far layers drift a little and near layers drift more => depth.
      // eased by u_influ (static at rest) and nudged by u_energy.
      vec2 m  = (u_mouse - 0.5) * u_influ;
      vec2 mE = m * (1.0 + u_energy*0.8);

      vec2 q = vec2( fbm(p + mE*0.08 + vec2(0.0,t)),
                     fbm(p + mE*0.08 + vec2(5.2,1.3 - t)) );
      vec2 r = vec2( fbm(p + 3.0*q + mE*0.16 + vec2(1.7,9.2) + 0.15*t),
                     fbm(p + 3.0*q + mE*0.16 + vec2(8.3,2.8) - 0.12*t) );
      float marble = fbm(p + 3.5*r + mE*0.26);

      float veins = abs(2.0*r.x - 1.0);
      veins = pow(1.0 - smoothstep(0.0,0.17,veins), 2.5);
      // a second finer set of cracks for the swirling-cave feel on the right
      float cracks = pow(1.0 - smoothstep(0.0,0.09,abs(2.0*q.y-1.0)), 3.0);

      vec3 dark = mix(vec3(0.010,0.018,0.012), vec3(0.035,0.06,0.04), marble);
      dark += vec3(0.05,0.11,0.06)*pow(marble,4.0);

      vec3 greenV = mix(vec3(0.02,0.22,0.04), vec3(0.32,1.0,0.30), marble);
      vec3 col = mix(dark, greenV, clamp(veins*0.92 + cracks*0.5, 0.0, 1.0));

      // -- static green lightning, left-weighted (always lit) --
      float glow = 0.0, hot = 0.0;
      const int NB = 3;
      for(int i=0;i<NB;i++){
        float fi = float(i);
        float seed = fi*1.91 + 0.3;
        float w = (i==0) ? 1.0 : 0.6;          // first bolt is the hero strike
        float baseX = 0.17 + fi*0.12;
        float c; float g = boltGlow(uv, baseX, seed, c);
        glow += g*w; hot += c*w;
        // a forked branch
        float bc; float bx = baseX + 0.07 + 0.05*sin(seed*3.0);
        float bg = boltGlow(uv, bx, seed+5.0, bc);
        float bmask = smoothstep(0.70,0.35,uv.y);
        glow += bg*w*0.5*bmask; hot += bc*w*0.5*bmask;
      }
      float lmask = smoothstep(1.05, 0.04, uv.x);   // strongest on the left
      glow *= lmask; hot *= lmask;

      col += vec3(0.30,1.0,0.34) * glow * (1.0  + u_energy*1.4);   // green bloom
      col += vec3(0.82,1.0,0.84) * hot  * (1.35 + u_energy*1.1);   // white-green core

      // key light where the bolt grounds (drifts gently with the cursor)
      vec2 keyPos = vec2(0.20,0.74) + (u_mouse-0.5)*0.06*u_influ;
      float key = smoothstep(0.95,0.0,distance(uv,keyPos));
      col += vec3(0.25,0.85,0.30) * key * 0.42;

      // -- wet reflective floor (static mirror, lower ~26%) --
      if(uv.y < 0.26){
        vec2 ruv = vec2(uv.x, 0.52 - uv.y);
        ruv.x += 0.012*sin(uv.x*40.0 + T*1.2);
        vec2 rp = ruv; rp.x *= u_res.x/u_res.y;
        vec2 rq = vec2(fbm(rp+vec2(0.0,t)),fbm(rp+vec2(5.2,1.3-t)));
        float rvein = pow(1.0-smoothstep(0.0,0.2,abs(2.0*rq.x-1.0)),2.5);
        vec3 refl = mix(vec3(0.01,0.02,0.012),vec3(0.28,1.0,0.30),rvein);
        float fade = smoothstep(0.0,0.26,uv.y);
        col = mix(refl*1.1, col, fade);
        col += vec3(0.25,0.9,0.28)*rvein*(1.0-fade)*0.5;

        float rG=0.0;
        for(int i=0;i<NB;i++){
          float fi=float(i); float seed=fi*1.91+0.3;
          float w=(i==0)?1.0:0.6;
          float c; float g=boltGlow(ruv,0.17+fi*0.12,seed,c);
          rG += (g+c)*w;
        }
        rG *= smoothstep(1.05,0.04,uv.x) * (1.0-fade);
        col += vec3(0.32,1.0,0.34) * rG * 0.7;
      }

      // -- HOVER REACTION: green energy that follows the cursor --
      if(u_influ > 0.001){
        vec2 dm = uv - u_mouse; dm.x *= u_res.x/u_res.y;
        float md = length(dm);
        float core = exp(-md*md*55.0);          // tight white-green spark
        float halo = 0.055 / (md + 0.05);       // soft glow falloff
        col += vec3(0.55,1.0,0.60) * core * 0.9      * u_influ;
        col += vec3(0.28,1.0,0.34) * halo * 0.22     * u_influ;
        // light up the marble veins the cursor passes over
        col += greenV * veins * exp(-md*5.0) * 0.6   * u_influ;
        // faint electric crackle ring around the pointer
        float ring = smoothstep(0.085,0.075,abs(md-0.10));
        col += vec3(0.5,1.0,0.55) * ring * (0.10 + 0.15*noise(uv*120.0)) * u_influ;
      }

      float vig = smoothstep(1.25,0.25,distance(uv,vec2(0.5)));
      col *= mix(0.35,1.0,vig);
      col = pow(col, vec3(0.85));
      gl_FragColor = vec4(col,1.0);
    }
  `;

  function compile(type,src){
    const s = gl.createShader(type);
    gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog,compile(gl.VERTEX_SHADER,vsrc));
  gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fsrc));
  gl.linkProgram(prog); gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

  const uRes    = gl.getUniformLocation(prog,'u_res');
  const uMouse  = gl.getUniformLocation(prog,'u_mouse');
  const uInflu  = gl.getUniformLocation(prog,'u_influ');
  const uEnergy = gl.getUniformLocation(prog,'u_energy');

  // size the canvas (only on init / window resize — not per frame)
  function resize(){
    const cap = window.innerWidth < 700 ? 1.25 : 1.75;
    const dpr = Math.min(window.devicePixelRatio||1, cap);
    canvas.width  = Math.floor(window.innerWidth*dpr);
    canvas.height = Math.floor(window.innerHeight*dpr);
    canvas.style.width  = window.innerWidth+'px';
    canvas.style.height = window.innerHeight+'px';
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
  }

  // eased cursor state — current trails toward target for a smooth feel
  let target=[0.5,0.6], cur=[0.5,0.6];
  let infTarget=0, infCur=0, energyTarget=0, energyCur=0, running=false;

  function draw(){
    gl.uniform2f(uMouse, cur[0], cur[1]);
    gl.uniform1f(uInflu, infCur);
    gl.uniform1f(uEnergy, energyCur);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }

  function tick(){
    cur[0] += (target[0]-cur[0])*0.16;
    cur[1] += (target[1]-cur[1])*0.16;
    infCur  += (infTarget-infCur)*0.09;
    energyTarget *= 0.90;                       // bursts fade when you slow down
    energyCur += (energyTarget-energyCur)*0.16;
    draw();
    const settling = Math.hypot(target[0]-cur[0], target[1]-cur[1]) > 0.0015
                  || Math.abs(infTarget-infCur) > 0.004
                  || energyCur > 0.01;
    if(settling){ requestAnimationFrame(tick); }
    else { infCur=infTarget; cur=target.slice(); energyCur=0; draw(); running=false; }
  }
  function kick(){ if(!running){ running=true; requestAnimationFrame(tick); } }

  const hero = document.querySelector('.hero');
  const coarse = window.matchMedia('(hover: none), (pointer: coarse)').matches;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if(coarse && !reduce){
    // -------- MOBILE: gentle autonomous "breathing" drift --------
    // no pointer on touch, so a slow virtual cursor traces a calm Lissajous
    // path and the whole scene drifts softly on its own. Paused when the
    // hero is off-screen or the tab is hidden (battery-friendly).
    let aRAF=0, aStart=0, visible=true;
    function ambient(now){
      if(!visible || document.hidden){ aRAF=0; return; }
      if(!aStart) aStart=now;
      const s=(now-aStart)*0.001;
      target[0]=0.5 +0.28*Math.sin(s*0.42);
      target[1]=0.55+0.15*Math.sin(s*0.31+1.2);
      cur[0]+=(target[0]-cur[0])*0.045;
      cur[1]+=(target[1]-cur[1])*0.045;
      infCur +=(0.55-infCur)*0.03;     // ease to a soft, constant influence
      draw();
      aRAF=requestAnimationFrame(ambient);
    }
    function startA(){ if(visible && !document.hidden && !aRAF){ aStart=0; aRAF=requestAnimationFrame(ambient); } }
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) startA(); });
    if('IntersectionObserver' in window){
      new IntersectionObserver(es=>{ visible=es[0].isIntersecting; if(visible) startA(); }, {threshold:0.04}).observe(hero);
    }
    startA();
  } else {
    // -------- DESKTOP: pointer-driven, static at rest --------
    let lastT;
    hero.addEventListener('pointermove', e=>{
      const r = canvas.getBoundingClientRect();
      const nx = (e.clientX-r.left)/r.width;
      const ny = 1 - (e.clientY-r.top)/r.height;
      const now = performance.now();
      if(lastT !== undefined){
        const dt = Math.max(now-lastT, 8);
        const speed = Math.hypot(nx-target[0], ny-target[1]) / (dt/16.7);
        energyTarget = Math.min(1.0, Math.max(energyTarget, speed*4.5));
      }
      lastT = now;
      target = [nx, ny];
      infTarget = 1; kick();
    });
    hero.addEventListener('pointerleave', ()=>{ infTarget = 0; energyTarget = 0; kick(); });
  }

  resize(); draw();   // one static frame to start
  let rt; window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>{ resize(); draw(); }, 120); });
})();
</script>
</body>
</html>
